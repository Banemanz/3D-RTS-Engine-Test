name: Download Windows EXE and Linux RTS Builds

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rts-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-binaries:
    name: ${{ matrix.platform }} executable build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x86_64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth

      - name: Configure Linux Release
        if: runner.os == 'Linux'
        run: >
          cmake -S "3D RTS (v0.3.10)" -B build
          -DCMAKE_BUILD_TYPE=Release
          -DRTS_BUILD_DEMO=ON
          -DBUILD_TESTING=ON

      - name: Configure Windows Release x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S "3D RTS (v0.3.10)" -B build
          -G "Visual Studio 17 2022" -A x64
          -DRTS_BUILD_DEMO=ON
          -DBUILD_TESTING=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Compile Release and all tests
        run: cmake --build build --config Release --parallel 2

      - name: Run CTest suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install self-contained project layout
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/dist/RTS-Creator-${{ matrix.platform }}"
        # bash is available on both ubuntu and GitHub's Windows runners.

      - name: Write build identity and verify bundle contents
        shell: bash
        run: |
          python tools/verify_build_bundle.py \
            "dist/RTS-Creator-${{ matrix.platform }}" \
            "${{ matrix.platform }}" \
            "${{ github.sha }}" \
            "${{ github.run_id }}"

      - name: Validate bundled maps with bundled project utility (Linux)
        if: runner.os == 'Linux'
        working-directory: dist/RTS-Creator-linux-x86_64
        run: |
          ./RTSProjectTool --validate projects/default.rtsproject.json
          ./RTSProjectTool --validate projects/terrain_showcase.rtsproject.json

      - name: Validate bundled maps with bundled project utility (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist/RTS-Creator-windows-x64
        run: |
          .\RTSProjectTool.exe --validate projects/default.rtsproject.json
          .\RTSProjectTool.exe --validate projects/terrain_showcase.rtsproject.json

      - name: Smoke test the packaged Linux editor with software OpenGL
        if: runner.os == 'Linux'
        working-directory: dist/RTS-Creator-linux-x86_64
        run: >
          xvfb-run -a -s "-screen 0 1280x720x24"
          env LIBGL_ALWAYS_SOFTWARE=1
          ./RTSCameraTerrain --editor
          --project projects/terrain_showcase.rtsproject.json
          --smoke-frames 12

      - name: Smoke test the packaged Linux scene editor
        if: runner.os == 'Linux'
        working-directory: dist/RTS-Creator-linux-x86_64
        run: >
          xvfb-run -a -s "-screen 0 1280x720x24"
          env LIBGL_ALWAYS_SOFTWARE=1
          ./RTSCameraTerrain --scene-editor
          --project projects/terrain_showcase.rtsproject.json
          --smoke-frames 12

      # GitHub Actions artifacts are ZIPs already. Upload the Windows
      # installation DIRECTORY, not a ZIP inside another ZIP.
      - name: Upload Windows x64 executable (unzip ONCE)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WINDOWS-x64-EXE-RTS-Creator-${{ github.run_number }}
          path: dist/RTS-Creator-windows-x64/
          if-no-files-found: error
          retention-days: 30

      # A tarball is intentional on Linux: the Actions artifact ZIP format
      # does not preserve chmod +x on shell scripts / ELF binaries.
      - name: Archive Linux build with executable permissions
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          tar -C dist -czf artifacts/RTS-Creator-linux-x86_64.tar.gz RTS-Creator-linux-x86_64

      - name: Upload Linux x86_64 executable tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LINUX-x86_64-RTS-Creator-${{ github.run_number }}
          path: artifacts/RTS-Creator-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
