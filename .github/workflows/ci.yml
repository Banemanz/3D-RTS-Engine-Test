  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S "3D RTS (v0.3.10)" -B build -DRTS_BUILD_DEMO=ON
      - name: Compile
        run: cmake --build build --config Debug
      - name: Unit tests
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Upload Windows replay state fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: rts-replay-fingerprint-windows
          path: |
            build/command_replay_fingerprint.txt
            build/ai_defense_fingerprint.txt
            build/trigger_globals_fingerprint.txt
            build/script_expression_fingerprint.txt
            build/script_flow_fingerprint.txt
            build/timed_effect_fingerprint.txt
            build/ability_cast_fingerprint.txt
            build/behavior_fingerprint.txt
            build/ground_area_fingerprint.txt
            build/projectile_fingerprint.txt
            build/area_shapes_fingerprint.txt
            build/weapon_fingerprint.txt
            build/weapon_projectile_fingerprint.txt
            build/actor_cues_fingerprint.txt
            build/requirement_fingerprint.txt
            build/upgrade_research_fingerprint.txt
            build/tech_visibility_fingerprint.txt
            build/ai_research_fingerprint.txt
          if-no-files-found: error

  replay-parity:
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - name: Download Windows state fingerprints
        uses: actions/download-artifact@v4
        with:
          name: rts-replay-fingerprint-windows
          path: fingerprints/windows
      - name: Download Linux state fingerprints
        uses: actions/download-artifact@v4
        with:
          name: rts-replay-fingerprint-linux
          path: fingerprints/linux
      - name: Require identical replay state checkpoints across operating systems
        run: |
          diff -u fingerprints/linux/command_replay_fingerprint.txt fingerprints/windows/command_replay_fingerprint.txt
          diff -u fingerprints/linux/ai_defense_fingerprint.txt fingerprints/windows/ai_defense_fingerprint.txt
          diff -u fingerprints/linux/trigger_globals_fingerprint.txt fingerprints/windows/trigger_globals_fingerprint.txt
          diff -u fingerprints/linux/script_expression_fingerprint.txt fingerprints/windows/script_expression_fingerprint.txt
          diff -u fingerprints/linux/script_flow_fingerprint.txt fingerprints/windows/script_flow_fingerprint.txt
          diff -u fingerprints/linux/timed_effect_fingerprint.txt fingerprints/windows/timed_effect_fingerprint.txt
          diff -u fingerprints/linux/ability_cast_fingerprint.txt fingerprints/windows/ability_cast_fingerprint.txt
          diff -u fingerprints/linux/behavior_fingerprint.txt fingerprints/windows/behavior_fingerprint.txt
          diff -u fingerprints/linux/ground_area_fingerprint.txt fingerprints/windows/ground_area_fingerprint.txt
          diff -u fingerprints/linux/projectile_fingerprint.txt fingerprints/windows/projectile_fingerprint.txt
          diff -u fingerprints/linux/area_shapes_fingerprint.txt fingerprints/windows/area_shapes_fingerprint.txt
          diff -u fingerprints/linux/weapon_fingerprint.txt fingerprints/windows/weapon_fingerprint.txt
          diff -u fingerprints/linux/weapon_projectile_fingerprint.txt fingerprints/windows/weapon_projectile_fingerprint.txt
          diff -u fingerprints/linux/actor_cues_fingerprint.txt fingerprints/windows/actor_cues_fingerprint.txt
          diff -u fingerprints/linux/requirement_fingerprint.txt fingerprints/windows/requirement_fingerprint.txt
          diff -u fingerprints/linux/upgrade_research_fingerprint.txt fingerprints/windows/upgrade_research_fingerprint.txt
          diff -u fingerprints/linux/tech_visibility_fingerprint.txt fingerprints/windows/tech_visibility_fingerprint.txt
          diff -u fingerprints/linux/ai_research_fingerprint.txt fingerprints/windows/ai_research_fingerprint.txt
