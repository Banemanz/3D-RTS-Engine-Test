name: Tests + screenshots (NOT executables)
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGL and GLFW headers
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S "3D RTS (v0.3.10)" -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Unit tests (no display required)
        run: ctest --test-dir build --output-on-failure
      - name: Upload Linux replay state fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: rts-replay-fingerprint-linux
          path: |
            build/command_replay_fingerprint.txt
            build/ai_defense_fingerprint.txt
            build/trigger_globals_fingerprint.txt
            build/script_expression_fingerprint.txt
            build/script_flow_fingerprint.txt
            build/timed_effect_fingerprint.txt
            build/ability_cast_fingerprint.txt
            build/behavior_fingerprint.txt
            build/ground_area_fingerprint.txt
            build/projectile_fingerprint.txt
            build/area_shapes_fingerprint.txt
            build/weapon_fingerprint.txt
            build/weapon_projectile_fingerprint.txt
            build/actor_cues_fingerprint.txt
            build/requirement_fingerprint.txt
            build/upgrade_research_fingerprint.txt
            build/tech_visibility_fingerprint.txt
            build/ai_research_fingerprint.txt
          if-no-files-found: error
      - name: Install software OpenGL smoke test dependencies
        run: sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Run headless OpenGL renderer and capture frame
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 ./build/RTSCameraTerrain --smoke-frames 120 --screenshot rts-smoke.ppm
      - name: Convert screenshot without extra dependencies
        run: python3 tools/ppm_to_png.py rts-smoke.ppm rts-smoke.png
      - name: Upload rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: rts-software-opengl-screenshot
          path: rts-smoke.png
          if-no-files-found: error
      - name: Capture AI defense combat laboratory (actual OpenGL renderer)
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 ./build/RTSCameraTerrain --project projects/ai_defense_showcase.rtsproject.json --smoke-frames 180 --screenshot rts-ai-defense.ppm
      - name: Convert AI defense screenshot
        run: python3 tools/ppm_to_png.py rts-ai-defense.ppm rts-ai-defense.png
      - name: Upload rendered AI defense scene
        uses: actions/upload-artifact@v4
        with:
          name: rts-ai-defense-screenshot
          path: rts-ai-defense.png
          if-no-files-found: error
      - name: Capture native pause menu with software OpenGL
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 ./build/RTSCameraTerrain --smoke-pause-menu --smoke-frames 35 --screenshot rts-pause.ppm
      - name: Convert native UI screenshot
        run: python3 tools/ppm_to_png.py rts-pause.ppm rts-pause.png
      - name: Upload native pause UI capture
        uses: actions/upload-artifact@v4
        with:
          name: rts-native-pause-menu-screenshot
          path: rts-pause.png
          if-no-files-found: error
      - name: Smoke test clickable RTS unit selection cards
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 ./build/RTSCameraTerrain --smoke-select-army --smoke-frames 80 --screenshot rts-group-hud.ppm
      - name: Convert group HUD screenshot
        run: python3 tools/ppm_to_png.py rts-group-hud.ppm rts-group-hud.png
      - name: Upload group HUD screenshot
